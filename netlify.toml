[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# Clean, extension-less URLs already come out of build.py (e.g. /wiki/slug/),
# so no extra redirect rules are needed for normal pages. This just makes
# sure the custom 404 page is served with the right status code.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
